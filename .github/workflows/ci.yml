name: Holiwork CI

on:
  push:
    branches:
      - main
      - holiwork/phase-3-security-and-ai
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders let CI compile without production credentials.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: holiwork-ci.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: holiwork-ci
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: holiwork-ci.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
      AI_PROVIDER: openai
      AI_MODEL: gpt-4o-mini
      AI_API_KEY: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run production build
        run: npm run build
